<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f4ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="106" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="96" y="128" width="320" height="333" rx="32" fill="url(#paper)" opacity="0.95"/>
  <!-- Calendar header -->
  <rect x="96" y="128" width="320" height="75" rx="32" fill="#1e40af"/>
  <rect x="96" y="193" width="320" height="10" fill="#1e40af"/>
  <!-- Calendar rings -->
  <rect x="160" y="97" width="16" height="64" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="304" y="97" width="16" height="64" rx="8" fill="#ffffff" opacity="0.9"/>
  <!-- Week day dots -->
  <circle cx="116" cy="244" r="11" fill="#93c5fd"/>
  <circle cx="186" cy="244" r="11" fill="#93c5fd"/>
  <circle cx="256" cy="244" r="11" fill="#93c5fd"/>
  <circle cx="326" cy="244" r="11" fill="#93c5fd"/>
  <circle cx="396" cy="244" r="11" fill="#93c5fd"/>
  <!-- Report lines -->
  <rect x="138" y="292" width="230" height="11" rx="5" fill="#bfdbfe"/>
  <rect x="138" y="324" width="189" height="11" rx="5" fill="#bfdbfe"/>
  <rect x="138" y="356" width="150" height="11" rx="5" fill="#bfdbfe"/>
  <!-- AI sparkle -->
  <g transform="translate(380,287)" fill="#fbbf24">
    <polygon points="0,-19 5,-5 19,0 5,5 0,19 -5,5 -19,0 -5,-5"/>
  </g>
</svg>