<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f4ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="36" y="48" width="120" height="125" rx="12" fill="url(#paper)" opacity="0.95"/>
  <!-- Calendar header -->
  <rect x="36" y="48" width="120" height="28" rx="12" fill="#1e40af"/>
  <rect x="36" y="72" width="120" height="4" fill="#1e40af"/>
  <!-- Calendar rings -->
  <rect x="60" y="36" width="6" height="24" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="114" y="36" width="6" height="24" rx="3" fill="#ffffff" opacity="0.9"/>
  <!-- Week day dots -->
  <circle cx="56" cy="91" r="4" fill="#93c5fd"/>
  <circle cx="76" cy="91" r="4" fill="#93c5fd"/>
  <circle cx="96" cy="91" r="4" fill="#93c5fd"/>
  <circle cx="116" cy="91" r="4" fill="#93c5fd"/>
  <circle cx="136" cy="91" r="4" fill="#93c5fd"/>
  <!-- Report lines -->
  <rect x="52" y="109" width="86" height="4" rx="2" fill="#bfdbfe"/>
  <rect x="52" y="121" width="71" height="4" rx="2" fill="#bfdbfe"/>
  <rect x="52" y="133" width="56" height="4" rx="2" fill="#bfdbfe"/>
  <!-- AI sparkle -->
  <g transform="translate(143,107)" fill="#fbbf24">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2"/>
  </g>
</svg>