[project]
name = "weekly-report-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort (import sorting)
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific
]
ignore = [
  "E501",   # line too long (formatter handles it)
  "B008",   # function call in default argument (FastAPI Depends)
  "RUF001", # ambiguous unicode — fullwidth CJK punctuation is intentional
  "RUF002", # ambiguous unicode in docstrings — same reason
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
