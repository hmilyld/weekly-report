version: 2

# 只开 PR，不自动合并：每个升级都要经过 CI 与人工判断。
# 分组规则把同一生态的 patch/minor 合并成一个 PR，减少噪音；
# major 版本单独提 PR，方便逐个评估破坏性变更。
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # passlib 1.7.4 的后端探测会用超过 72 字节的口令调用 bcrypt.hashpw，
      # bcrypt 5 改为抛 ValueError，登录与改密会全部失败。
      # 迁离 passlib 之后才能接受 bcrypt 的 major 升级。
      - dependency-name: bcrypt
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(deps)'
