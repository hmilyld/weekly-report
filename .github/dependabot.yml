version: 2

# 只开 PR，不自动合并：每个升级都要经过 CI 与人工判断。
# 分组规则把同一生态的 patch/minor 合并成一个 PR，减少噪音；
# major 版本单独提 PR，方便逐个评估破坏性变更。
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # passlib 1.7.4 已停止维护：bcrypt 5 会让哈希初始化直接抛 ValueError（登录全挂），
      # bcrypt ≥4.1 虽能工作但每次加载后端都会打印 "error reading bcrypt version" 堆栈。
      # 在迁离 passlib 之前，bcrypt 的所有版本更新都跳过。
      - dependency-name: bcrypt

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Vite 8 改变了 JSX 转换默认行为，现有测试与 PWA 插件需要单独迁移验证。
      - dependency-name: vite
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(deps)'
