name: 功能建议
description: 提出新功能或改进现有行为
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再描述方案。涉及公共契约（`/api/v1` 结构、错误码、环境变量、数据格式）的改动请单独标注。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便，或者缺少什么能力
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作；如果涉及界面，可以附草图
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么现有的做法不够用

  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      options:
        - label: 仅前端界面
        - label: 仅后端逻辑
        - label: 涉及 `/api/v1` 契约或数据格式（需要兼容或迁移方案）
        - label: 涉及部署、环境变量或镜像

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue 与文档，没有重复
          required: true
