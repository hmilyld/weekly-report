name: CI

# PR 与 main 推送时的质量门禁：后端 ruff + pytest，前端 lint + format + build。
# 发布镜像的流程在 release-image.yml，两者互不影响。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.17'
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      # ruff 与 pytest 只在 dev-requirements.txt 中声明；
      # 干净环境必须同时装两份清单，才能复现本地命令。
      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -r requirements.txt -r dev-requirements.txt

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest, coverage report)
        run: uv run pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Test (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
