name: Release image

# 打上 v* 标签即自动构建并发布到 GitHub Container Registry (ghcr.io)，
# 也可以在 Actions 页面手动指定标签运行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v1.2.0'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            value="$INPUT_TAG"
          else
            value="$REF_NAME"
          fi
          value="$(printf '%s' "$value" | tr -d '[:space:]')"
          if [ -z "$value" ]; then
            echo "::error::没有拿到标签名。手动运行时请填写 tag（例如 v1.0.0）。"
            exit 1
          fi
          case "$value" in
            v[0-9]*) ;;
            *)
              echo "::error::标签必须以 v 开头并且是语义化版本，例如 v1.0.0（收到：$value）"
              exit 1
              ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "使用标签：$value"

      # 先确认标签真的存在于远端，否则 checkout 只会抛出一句难懂的 git 错误。
      - name: Verify the tag exists on origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          host="${{ github.server_url }}"
          host="${host#https://}"
          url="https://x-access-token:${GH_TOKEN}@${host}/${{ github.repository }}.git"
          if git ls-remote --exit-code --tags "$url" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "远端已存在标签 ${TAG}"
          else
            echo "::error::远端不存在标签 ${TAG}。先推送标签再发布：git tag ${TAG} && git push origin ${TAG}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # 用全限定 ref，避免 checkout 用通配 refspec 去猜分支
          ref: refs/tags/${{ steps.version.outputs.value }}

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 预发布（如 v1.2.0-rc1）只发精确版本，不移动浮动标签与 latest
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }},enable=${{ !contains(steps.version.outputs.value, '-') }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }},enable=${{ !contains(steps.version.outputs.value, '-') && !startsWith(steps.version.outputs.value, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.value, '-') }}
          labels: |
            org.opencontainers.image.title=weekly-report
            org.opencontainers.image.description=日报管理 + 大模型自动生成周报、月报

      # 先构建到本地跑冒烟测试，通过后再推送，避免把坏镜像发出去。
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -p 18001:18001 \
            -e JWT_SECRET_KEY=smoke-test-secret-key-12345678 \
            "${IMAGE}:${{ steps.meta.outputs.version }}" || true

          status=""
          for _ in $(seq 1 30); do
            status=$(curl -sf http://localhost:18001/api/v1/health || true)
            if echo "${status}" | grep -q ok; then break; fi
            sleep 2
          done

          docker logs smoke || true
          docker rm -f smoke >/dev/null 2>&1 || true

          if ! echo "${status}" | grep -q ok; then
            echo "::error::冒烟测试失败：/api/v1/health 未返回 ok（${status}）"
            exit 1
          fi
          echo "冒烟测试通过"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 已发布镜像"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "版本号（前端页脚显示）：\`${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
