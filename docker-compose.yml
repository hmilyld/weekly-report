services:
  weekly-report:
    image: hmilyld/weekly-report:latest
    build: .
    container_name: weekly-report
    ports:
      - "127.0.0.1:18001:18001"
    volumes:
      - ./data:/app/data
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?请在 .env 文件中设置 JWT_SECRET_KEY}
      - DATABASE_URL=sqlite:///./data/weekly_report.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18001/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
